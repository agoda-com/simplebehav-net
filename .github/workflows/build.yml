# Same publish shape as github.com/agoda-com/AgodaAnalyzers/.github/workflows/build.yml:
# a push to the default branch packs <VersionPrefix>.<run>, pushes to nuget.org, and publishes a GitHub release.
# Pull requests pack a -preview build and upload it as an artifact. They do not push to NuGet.
name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
    env:
      SIMPLEBEHAV_HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build SimpleBehav.sln --configuration Release

      - name: Install Playwright
        run: pwsh tests/SimpleBehav.Tests/bin/Release/net8.0/playwright.ps1 install chromium --with-deps

      - name: Test
        run: dotnet test SimpleBehav.sln --no-build --configuration Release

      - name: Pack
        id: pack
        run: |
          prefix=$(sed -n 's:.*<VersionPrefix>\([^<]*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            version="${prefix}.${GITHUB_RUN_NUMBER}"
          else
            version="${prefix}.${GITHUB_RUN_NUMBER}-preview"
          fi
          for p in SimpleBehav SimpleBehav.NUnit SimpleBehav.SpecGen; do
            dotnet pack "src/$p" --configuration Release -p:ContinuousIntegrationBuild=true -p:Version="$version" --output nupkgs
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: nupkgs

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: Deploy Packages
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: Download Package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkgs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Push to NuGet
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    needs: [build, deploy]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.build.outputs.version }}"
          gh release view "$version" --repo "${{ github.repository }}" \
            || gh release create "$version" --repo "${{ github.repository }}" --title "$version" --generate-notes
